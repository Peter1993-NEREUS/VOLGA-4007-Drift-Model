name: Build NEREUS Operations APK
on:
  push:
    branches: [ nereus-operations-apk-build ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Validate JS
        run: |
          node --check nereus-operations-v02/app/src/main/assets/native-net.js
          node --check nereus-operations-v02/app/src/main/assets/app.js
          node --check nereus-operations-v02/app/src/main/assets/mobile-v034.js
          node --check nereus-operations-v02/app/src/main/assets/status-v036.js
          node --check nereus-operations-v02/app/src/main/assets/port-status-v037.js
          node --check nereus-operations-v02/app/src/main/assets/refresh-v038.js
          node --check nereus-operations-v02/app/src/main/assets/schedules-v039.js
          node --check nereus-operations-v02/app/src/main/assets/admin-access-v040.js
          node --check nereus-operations-v02/app/src/main/assets/export-v042.js
          node --check nereus-operations-v02/app/src/main/assets/port-info-v043.js
      - name: Build APK
        working-directory: nereus-operations-v02
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: |
          APK=nereus-operations-v02/app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$APK"
      - name: Rename APK
        run: cp nereus-operations-v02/app/build/outputs/apk/debug/app-debug.apk NEREUS-Operations-v0.4.4.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NEREUS-Operations-v0.4.4-APK
          path: NEREUS-Operations-v0.4.4.apk
          retention-days: 30
