name: Build NEREUS Operations APK
on:
  push:
    branches: [ nereus-operations-apk-build ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Validate JS
        run: node --check nereus-operations-v02/app/src/main/assets/app.js
      - name: Build APK
        working-directory: nereus-operations-v02
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp nereus-operations-v02/app/build/outputs/apk/debug/app-debug.apk NEREUS-Operations-v0.2.0-live-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NEREUS-Operations-v0.2.0-live-test-APK
          path: NEREUS-Operations-v0.2.0-live-test.apk
          retention-days: 30
