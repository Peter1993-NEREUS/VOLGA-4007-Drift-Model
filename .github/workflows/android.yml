name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, pending-test-fixes ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.CMEMS_USERNAME }}
      COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.CMEMS_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate v1.7.0 JavaScript, Python and feature wiring
        run: |
          for f in v14 v141 v150 v151 v152 v160 v161 v162 v163 v164 v165 v166 v167 v168 v169 v170 v171 v172 v173 v174; do
            node --check "app/src/main/assets/${f}.js"
          done
          python -m py_compile tools/lookup_vessel.py tools/build_driftpack.py tools/build_dynamic_pack.py
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          base=Path('app/src/main/assets/v14.js').read_text(encoding='utf-8')
          names=['v141.js','v150.js','v151.js','v152.js','v160.js','v161.js','v162.js','v163.js','v164.js','v165.js','v166.js','v167.js','v168.js','v169.js','v170.js','v171.js','v172.js','v173.js','v174.js']
          enh='\n'.join(Path('app/src/main/assets',x).read_text(encoding='utf-8') for x in names)
          java=Path('app/src/main/java/com/nereus/volgadrift/MainActivity.java').read_text(encoding='utf-8')
          manifest=Path('app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          gradle=Path('app/build.gradle').read_text(encoding='utf-8')
          ids=set(re.findall(r'id="([^"]+)"',html))
          refs=set(re.findall(r"\$\('([^']+)'\)",base))
          missing=sorted(refs-ids)
          if missing: raise SystemExit('Missing base HTML ids: '+', '.join(missing))
          required=['Developed by Peter Mirronov','Pre-flight check','COPY DRIFT SUMMARY','Recent calculations','CUSTOM VESSEL','SAVE AS NEW','RENAME','Wind data','Weather at point','POINT WEATHER FORECAST','CUSTOM •','Vessel data lookup','START POINT','distance travelled','HISTORY SNAPSHOT','nereusPrintJobName','notifyVessel','SYSTEM CHECK','routeAnchorMs','LEEWAY MODEL','CALIBRATE LEEWAY','AUTO FALLBACK','ROUTE-AWARE WIND','spatial points','AUTO v2','SHIP GEOMETRY','PROJECTED LATERAL AREA','GT VOLUME','geometrySchema','v1.7.0']
          for marker in required:
            if marker not in enh and marker not in java and marker not in gradle and marker not in Path('tools/lookup_vessel.py').read_text(encoding='utf-8'):
              raise SystemExit('Missing v1.7.0 marker: '+marker)
          for marker in ['POST_NOTIFICATIONS','orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden']:
            if marker not in manifest: raise SystemExit('Android manifest marker missing: '+marker)
          for marker in ['getNotificationStatus','sendTestNotification','openNotificationSettings','onConfigurationChanged']:
            if marker not in java: raise SystemExit('Android bridge marker missing: '+marker)
          # Native activity loads through v171. v171 chains v172/v173; v173 chains v174.
          for loader in names[:-3]:
            if loader not in java: raise SystemExit('Loader missing: '+loader)
          chain=Path('app/src/main/assets/v171.js').read_text(encoding='utf-8')
          for loader in ['v172.js','v173.js']:
            if loader not in chain: raise SystemExit(loader+' chained loader missing from v171')
          route=Path('app/src/main/assets/v173.js').read_text(encoding='utf-8')
          if 'v174.js' not in route: raise SystemExit('v174 chained loader missing from v173')
          if "versionName '1.7.0'" not in gradle: raise SystemExit('Android versionName mismatch')
          print(f'v1.7.0 validation OK: {len(ids)} base IDs, {len(refs)} base JS refs, {len(names)} enhancement modules')
          PY

      - name: Install Copernicus and NetCDF tools
        run: python -m pip install --upgrade pip copernicusmarine netCDF4 numpy

      - name: Check CMEMS secrets
        run: |
          test -n "$COPERNICUSMARINE_SERVICE_USERNAME" || (echo "Missing CMEMS_USERNAME secret" && exit 2)
          test -n "$COPERNICUSMARINE_SERVICE_PASSWORD" || (echo "Missing CMEMS_PASSWORD secret" && exit 2)

      - name: Download regional Black Sea currents
        run: |
          mkdir -p data
          copernicusmarine subset -i cmems_mod_blk_phy-cur_anfc_2.5km_PT1H-m \
            -v uo -v vo -x 35.0 -X 39.5 -y 42.5 -Y 45.5 -z 0 -Z 5 \
            -t 2026-08-19T07:00:00 -T 2026-08-27T23:00:00 \
            -f data/regional.nc --overwrite

      - name: Download Black Sea Stokes drift
        run: |
          copernicusmarine subset -i cmems_mod_blk_wav_anfc_2.5km_PT1H-i \
            -v VSDX -v VSDY -x 35.0 -X 39.5 -y 42.5 -Y 45.5 \
            -t 2026-08-19T07:00:00 -T 2026-09-01T07:00:00 \
            -f data/stokes.nc --overwrite

      - name: Download global hourly currents
        run: |
          copernicusmarine subset -i cmems_mod_glo_phy_anfc_merged-uv_PT1H-i \
            -v uo -v vo -x 35.0 -X 39.5 -y 42.5 -Y 45.5 \
            -t 2026-08-19T07:00:00 -T 2026-09-01T07:00:00 \
            -f data/global.nc --overwrite

      - name: Build offline drift pack
        run: python tools/build_driftpack.py --regional data/regional.nc --stokes data/stokes.nc --global-uv data/global.nc --assets app/src/main/assets

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Marine-Drift-Model-by-NEREUS-v1.7.0-PRE-RELEASE.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Marine-Drift-Model-by-NEREUS-v1.7.0-PRE-RELEASE-APK
          path: Marine-Drift-Model-by-NEREUS-v1.7.0-PRE-RELEASE.apk
          if-no-files-found: error
          retention-days: 30
