name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, pending-test-fixes ]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.CMEMS_USERNAME }}
      COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.CMEMS_PASSWORD }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate desktop and shared JavaScript
        shell: pwsh
        run: |
          $files = @('v14','v141','v150','v151','v152','v160','v161','v162','v163','v164','v165','v166','v167','v168','v169','v170','v171','v172','v173','v174','v175','v176')
          foreach ($f in $files) { node --check "app/src/main/assets/$f.js" }
          node --check desktop/main.js
          node --check desktop/preload.js
          python -m py_compile tools/lookup_vessel.py tools/build_driftpack.py tools/build_dynamic_pack.py
          $main = Get-Content desktop/main.js -Raw
          $pre = Get-Content desktop/preload.js -Raw
          $v171 = Get-Content app/src/main/assets/v171.js -Raw
          $v172 = Get-Content app/src/main/assets/v172.js -Raw
          $v173 = Get-Content app/src/main/assets/v173.js -Raw
          $v174 = Get-Content app/src/main/assets/v174.js -Raw
          $v175 = Get-Content app/src/main/assets/v175.js -Raw
          $v176 = Get-Content app/src/main/assets/v176.js -Raw
          $lookup = Get-Content tools/lookup_vessel.py -Raw
          $pkg = Get-Content package.json -Raw
          foreach ($marker in @('contextIsolation: true','nodeIntegration: false','safeStorage','127.0.0.1','printToPDF','v171.js','v175.js','v176.js')) { if (-not $main.Contains($marker)) { throw "Desktop marker missing: $marker" } }
          foreach ($marker in @('getNotificationStatus','sendTestNotification','openNotificationSettings','getGithubToken')) { if (-not $pre.Contains($marker)) { throw "Preload bridge marker missing: $marker" } }
          foreach ($marker in @('v172.js','v173.js')) { if (-not $v171.Contains($marker)) { throw "Chained route module missing from v171: $marker" } }
          if (-not $v173.Contains('v174.js')) { throw 'AUTO v2 chained loader missing from v173' }
          foreach ($marker in @('LEEWAY MODEL','CALIBRATE LEEWAY','AUTO FALLBACK','calibrationValid')) { if (-not $v172.Contains($marker)) { throw "Leeway feature marker missing: $marker" } }
          foreach ($marker in @('ROUTE-AWARE WIND','spatial points','multi-point','sampleRouteWind')) { if (-not $v173.Contains($marker)) { throw "Route wind feature marker missing: $marker" } }
          foreach ($marker in @('AUTO v2','SHIP GEOMETRY','PROJECTED LATERAL AREA','GT VOLUME','calibrationValidV2','volumeFromGt')) { if (-not $v174.Contains($marker)) { throw "AUTO v2 marker missing: $marker" } }
          foreach ($marker in @('pending-test-fixes','POLL_MS=4000','CMEMS workflow','fast failure detection')) { if (-not $v175.Contains($marker)) { throw "CMEMS fast-path marker missing: $marker" } }
          foreach ($marker in @('STARTUP FAST PATH','regional.bin','stokes.bin','global.bin','firstSilent')) { if (-not $v176.Contains($marker)) { throw "Startup fast-path marker missing: $marker" } }
          foreach ($marker in @('geometrySchema','Length Between Perpendiculars','Moulded Depth','Displacement (t)','Air Draught')) { if (-not $lookup.Contains($marker)) { throw "Extended lookup marker missing: $marker" } }
          foreach ($marker in @('electron-builder --win nsis --x64','"target": "nsis"','"perMachine": false','Windows-Setup')) { if (-not $pkg.Contains($marker)) { throw "Windows setup marker missing: $marker" } }

      - name: Install Copernicus and NetCDF tools
        run: python -m pip install --upgrade pip copernicusmarine netCDF4 numpy

      - name: Check CMEMS secrets
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:COPERNICUSMARINE_SERVICE_USERNAME)) { throw 'Missing CMEMS_USERNAME secret' }
          if ([string]::IsNullOrWhiteSpace($env:COPERNICUSMARINE_SERVICE_PASSWORD)) { throw 'Missing CMEMS_PASSWORD secret' }

      - name: Download regional Black Sea currents
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force data | Out-Null
          copernicusmarine subset -i cmems_mod_blk_phy-cur_anfc_2.5km_PT1H-m `
            -v uo -v vo -x 35.0 -X 39.5 -y 42.5 -Y 45.5 -z 0 -Z 5 `
            -t 2026-08-19T07:00:00 -T 2026-08-27T23:00:00 `
            -f data/regional.nc --overwrite

      - name: Download Black Sea Stokes drift
        shell: pwsh
        run: |
          copernicusmarine subset -i cmems_mod_blk_wav_anfc_2.5km_PT1H-i `
            -v VSDX -v VSDY -x 35.0 -X 39.5 -y 42.5 -Y 45.5 `
            -t 2026-08-19T07:00:00 -T 2026-09-01T07:00:00 `
            -f data/stokes.nc --overwrite

      - name: Download global hourly currents
        shell: pwsh
        run: |
          copernicusmarine subset -i cmems_mod_glo_phy_anfc_merged-uv_PT1H-i `
            -v uo -v vo -x 35.0 -X 39.5 -y 42.5 -Y 45.5 `
            -t 2026-08-19T07:00:00 -T 2026-09-01T07:00:00 `
            -f data/global.nc --overwrite

      - name: Build offline drift pack
        run: python tools/build_driftpack.py --regional data/regional.nc --stokes data/stokes.nc --global-uv data/global.nc --assets app/src/main/assets

      - name: Install pinned desktop dependencies
        run: npm install --no-audit --no-fund

      - name: Build installed Windows Setup EXE
        run: npm run dist:win

      - name: Show build output
        shell: pwsh
        run: Get-ChildItem -Recurse dist | Select-Object FullName,Length

      - name: Upload Windows Setup EXE
        uses: actions/upload-artifact@v4
        with:
          name: Marine-Drift-Model-by-NEREUS-v1.7.0-Windows-Setup-EXE
          path: dist/*Windows-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
