name: Build Online CMEMS Pack
run-name: CMEMS ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id: {description: Request ID, required: true, type: string}
      start_utc: {description: Start UTC ISO, required: true, type: string}
      end_utc: {description: End UTC ISO, required: true, type: string}
      center_lat: {description: Center latitude, required: true, type: string}
      center_lon: {description: Center longitude, required: true, type: string}
      radius_deg: {description: Data radius in degrees, required: true, default: '3.0', type: string}
      draft_m: {description: Vessel draft, required: true, default: '4.68', type: string}
      vessel_name: {description: Vessel name, required: true, default: 'VOLGA-4007', type: string}
      imo: {description: IMO number, required: false, default: '', type: string}
      cargo: {description: Cargo MT, required: false, default: '', type: string}
      loa_m: {description: LOA m, required: false, default: '0', type: string}
      beam_m: {description: Beam m, required: false, default: '0', type: string}
      leeway: {description: Leeway fraction, required: true, default: '0.003', type: string}
      local_offset: {description: Local UTC offset hours, required: true, default: '3', type: string}

permissions:
  contents: write

concurrency:
  group: online-cmems-${{ github.ref }}
  cancel-in-progress: true

env:
  COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.CMEMS_USERNAME }}
  COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.CMEMS_PASSWORD }}

jobs:
  build-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: python -m pip install --disable-pip-version-check copernicusmarine==2.4.1 netCDF4 numpy

      - name: Validate request and calculate bbox
        shell: bash
        run: |
          test -n "$COPERNICUSMARINE_SERVICE_USERNAME" || (echo 'Missing CMEMS_USERNAME' && exit 2)
          test -n "$COPERNICUSMARINE_SERVICE_PASSWORD" || (echo 'Missing CMEMS_PASSWORD' && exit 2)
          python - <<'PY' >> "$GITHUB_ENV"
          from datetime import datetime
          lat=float('${{ inputs.center_lat }}'); lon=float('${{ inputs.center_lon }}'); r=float('${{ inputs.radius_deg }}')
          start=datetime.fromisoformat('${{ inputs.start_utc }}'.replace('Z','+00:00'))
          end=datetime.fromisoformat('${{ inputs.end_utc }}'.replace('Z','+00:00'))
          if not (-80 <= lat <= 89): raise SystemExit('Latitude must be -80..89')
          if not (-179.9 <= lon <= 179.9): raise SystemExit('Longitude must be -179.9..179.9')
          if not (0.25 <= r <= 12): raise SystemExit('radius_deg must be 0.25..12')
          if end <= start: raise SystemExit('End must be later than start')
          if (end-start).total_seconds() > 31*86400: raise SystemExit('Maximum online window is 31 days')
          lo=max(-179.9,lon-r); hi=min(179.9,lon+r); la=max(-80,lat-r); ha=min(89,lat+r)
          print(f'MIN_LON={lo}'); print(f'MAX_LON={hi}'); print(f'MIN_LAT={la}'); print(f'MAX_LAT={ha}')
          print(f'REG_Z={min(20.0,max(.5,float("${{ inputs.draft_m }}")))}')
          print('IS_BLACKSEA=1' if 27 <= lon <= 42 and 40 <= lat <= 47 else 'IS_BLACKSEA=0')
          PY

      - name: Select datasets and padded source windows
        shell: bash
        run: |
          START='${{ inputs.start_utc }}'
          if [[ "$START" > '2022-06-01T00:00:00Z' ]]; then
            echo 'CURRENT_DS=cmems_mod_glo_phy-cur_anfc_0.083deg_PT6H-i' >> "$GITHUB_ENV"
          else
            echo 'CURRENT_DS=cmems_mod_glo_phy_my_0.083deg_P1D-m' >> "$GITHUB_ENV"
          fi
          if [[ "$START" > '2022-11-01T00:00:00Z' ]]; then
            echo 'WAVE_DS=cmems_mod_glo_wav_anfc_0.083deg_PT3H-i' >> "$GITHUB_ENV"
          else
            echo 'WAVE_DS=cmems_mod_glo_wav_my_0.2deg_PT3H-i' >> "$GITHUB_ENV"
          fi
          python - <<'PY' >> "$GITHUB_ENV"
          from datetime import datetime,timedelta
          s=datetime.fromisoformat('${{ inputs.start_utc }}'.replace('Z','+00:00'))
          e=datetime.fromisoformat('${{ inputs.end_utc }}'.replace('Z','+00:00'))
          cpad=6 if s.isoformat().replace('+00:00','Z') > '2022-06-01T00:00:00Z' else 24
          def z(d): return d.isoformat().replace('+00:00','Z')
          print('CURRENT_START='+z(s-timedelta(hours=cpad)))
          print('CURRENT_END='+z(e+timedelta(hours=cpad)))
          print('WAVE_START='+z(s-timedelta(hours=3)))
          print('WAVE_END='+z(e+timedelta(hours=3)))
          print('REG_START='+z(s-timedelta(hours=1)))
          print('REG_END='+z(e+timedelta(hours=1)))
          PY

      - name: Download global 3D currents with bounded retry
        shell: bash
        run: |
          mkdir -p data publish
          for attempt in 1 2; do
            echo "CMEMS current attempt $attempt/2"
            if timeout --signal=INT 90s copernicusmarine subset -i "$CURRENT_DS" -v uo -v vo \
              -x "$MIN_LON" -X "$MAX_LON" -y "$MIN_LAT" -Y "$MAX_LAT" \
              -z 0 -Z '${{ inputs.draft_m }}' -t "$CURRENT_START" -T "$CURRENT_END" \
              -f data/global.nc --overwrite; then
              test -s data/global.nc && break
            fi
            rm -f data/global.nc
            if [ "$attempt" -eq 2 ]; then
              echo '::error::Copernicus current download/authentication failed after two bounded attempts.'
              exit 1
            fi
            sleep 4
          done

      - name: Download global Stokes drift with bounded retry
        shell: bash
        run: |
          for attempt in 1 2; do
            echo "CMEMS Stokes attempt $attempt/2"
            if timeout --signal=INT 90s copernicusmarine subset -i "$WAVE_DS" -v VSDX -v VSDY \
              -x "$MIN_LON" -X "$MAX_LON" -y "$MIN_LAT" -Y "$MAX_LAT" \
              -t "$WAVE_START" -T "$WAVE_END" \
              -f data/stokes.nc --overwrite; then
              test -s data/stokes.nc && break
            fi
            rm -f data/stokes.nc
            if [ "$attempt" -eq 2 ]; then
              echo '::error::Copernicus Stokes download/authentication failed after two bounded attempts.'
              exit 1
            fi
            sleep 4
          done

      - name: Try Black Sea regional current enhancement
        if: env.IS_BLACKSEA == '1'
        shell: bash
        run: |
          set +e
          timeout --signal=INT 75s copernicusmarine subset -i cmems_mod_blk_phy-cur_anfc_2.5km_PT1H-m -v uo -v vo \
            -x "$MIN_LON" -X "$MAX_LON" -y "$MIN_LAT" -Y "$MAX_LAT" -z 0 -Z "$REG_Z" \
            -t "$REG_START" -T "$REG_END" -f data/regional.nc --overwrite
          if [ $? -ne 0 ] || [ ! -s data/regional.nc ]; then rm -f data/regional.nc; fi
          exit 0

      - name: Build compact pack
        shell: bash
        run: |
          REG=''
          if [ -s data/regional.nc ]; then REG='--regional data/regional.nc'; fi
          python tools/build_dynamic_pack.py \
            --global-current data/global.nc --stokes data/stokes.nc $REG --out publish \
            --request-id '${{ inputs.request_id }}' --start-utc '${{ inputs.start_utc }}' --end-utc '${{ inputs.end_utc }}' \
            --draft '${{ inputs.draft_m }}' --vessel '${{ inputs.vessel_name }}' --imo '${{ inputs.imo }}' --cargo '${{ inputs.cargo }}' \
            --loa '${{ inputs.loa_m }}' --beam '${{ inputs.beam_m }}' --leeway '${{ inputs.leeway }}' \
            --local-offset '${{ inputs.local_offset }}' --current-product "$CURRENT_DS" --wave-product "$WAVE_DS"

      - name: Publish latest pack to data branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd publish
          git init
          git config user.name 'VOLGA Drift Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b data
          git add .
          git commit -m "CMEMS pack ${{ inputs.request_id }}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin data
