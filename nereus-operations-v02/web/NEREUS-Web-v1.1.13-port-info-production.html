<style>.export-box{background:#0d2233;border:1px solid #234156;border-radius:14px;padding:12px;margin:10px 0}.export-title{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}.export-title small{color:#89a6b8}.export-grid{display:grid;grid-template-columns:minmax(140px,1fr) 80px 80px;gap:1px;background:#234156;border:1px solid #234156;border-radius:9px;overflow:hidden}.export-grid>div{background:#091b29;padding:9px;font-size:11px}.export-grid .h{background:#15344c;font-weight:700;color:#bfe9ff}.export-link{display:inline-block;padding:5px 8px;border-radius:7px;background:#17405a;color:white;text-decoration:none;font-weight:700}.export-note{padding:12px;border:1px solid #765f26;border-radius:10px;background:#2a2412;color:#f7dda0}</style></head><body>

<script>
(function(){
const EXPORT_API='https://bzfzghszxqartljpjsmc.supabase.co/functions/v1/nereus-export';
function exportAllowed(){return state.user?.role==='admin'||state.user?.schedules_access===true}
function syncExportNav(){const n=document.querySelector('#exportNav');if(n)n.classList.toggle('hidden',!exportAllowed())}
const baseAppView=appView;appView=function(){baseAppView();syncExportNav()};
async function exportManifest(){let r;try{r=await fetch(EXPORT_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'manifest',device_id:device,access_token:state.token}),cache:'no-store'})}catch(_){throw Error('CONNECTION_ERROR')}let d;try{d=await r.json()}catch(_){throw Error('SERVER_RESPONSE_ERROR')}if(!r.ok||!d.ok)throw Error(d.error||'EXPORT_ERROR');return d.exports}
const link=(u,t)=>u?`<a class="export-link" href="${esc(u)}" target="_blank" rel="noopener">${t}</a>`:'—';
function rows(o){return Object.entries(o||{}).map(([k,v])=>`<div>${esc(v?.name||k)}</div><div>${link(v?.pdf,'PDF')}</div><div>${link(v?.xlsx,'XLSX')}</div>`).join('')}
function box(title,sub,body,extra=''){return`<div class="export-box"><div class="export-title"><b>${title}</b><small>${sub}</small></div><div class="export-grid"><div class="h">REPORT</div><div class="h">PDF</div><div class="h">XLSX</div>${body}</div>${extra}</div>`}
async function renderExport(){const root=document.querySelector('#export');if(!exportAllowed()){root.innerHTML='';return}root.innerHTML='<div class="empty">Загрузка Export Center…</div>';try{const m=await exportManifest(),v=m.views||{};root.innerHTML='<div class="section">EXPORT CENTER</div>'+box('SCHEDULES','исходные табличные сводки',rows(m.schedules))+box('PORT VIEWS · COMMERCIAL','все колонки',rows(v.commercial),v.all_commercial_xlsx?`<div style="margin-top:9px">${link(v.all_commercial_xlsx,'ALL 4 PORTS · XLSX')}</div>`:'')+box('PORT VIEWS · NO COMMERCIAL','без коммерческих полей',rows(v.no_commercial),v.all_no_commercial_xlsx?`<div style="margin-top:9px">${link(v.all_no_commercial_xlsx,'ALL 4 PORTS · XLSX')}</div>`:'')+box('WEATHER REPORT','актуальная погода',`<div>${esc(m.weather?.name||'Weather Report')}</div><div>${link(m.weather?.pdf,'PDF')}</div><div>${link(m.weather?.xlsx,'XLSX')}</div>`)}catch(e){root.innerHTML=`<div class="section">EXPORT CENTER</div><div class="export-note">${e.message==='EXPORT_MANIFEST_NOT_AVAILABLE'?'Установите Apps Script v0.4.3 и обновите данные.':'Экспорт сейчас недоступен: '+esc(e.message)}</div>`}}
const baseSwitch=switchView;switchView=function(v){if(v==='export'){if(!exportAllowed())return baseSwitch('brief');state.view='export';['brief','schedules','weather','export','admin'].forEach(x=>document.querySelector('#'+x)?.classList.toggle('hidden',x!=='export'));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view==='export'));document.querySelector('#reportMeta').textContent='Export Center';renderExport();return}document.querySelector('#export')?.classList.add('hidden');baseSwitch(v);syncExportNav()};
const baseRender=render;render=function(){baseRender();syncExportNav();if(state.view==='export')renderExport()};
syncExportNav();
})();
</script>
