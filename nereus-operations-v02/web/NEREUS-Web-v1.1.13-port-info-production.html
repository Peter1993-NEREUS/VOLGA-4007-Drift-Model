<script>
(function(){
const EXPORT_API='https://bzfzghszxqartljpjsmc.supabase.co/functions/v1/nereus-export';
function exportAllowed(){return state.user?.role==='admin'||state.user?.schedules_access===true}
function syncExportNav(){const n=document.querySelector('#exportNav');if(n)n.classList.toggle('hidden',!exportAllowed())}
const baseAppView=appView;appView=function(){baseAppView();syncExportNav()};

async function exportManifest(){
  let r;
  try{
    r=await fetch(EXPORT_API,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'manifest',device_id:device,access_token:state.token}),
      cache:'no-store'
    });
  }catch(_){throw Error('CONNECTION_ERROR')}
  let d;try{d=await r.json()}catch(_){throw Error('SERVER_RESPONSE_ERROR')}
  if(!r.ok||!d.ok)throw Error(d.error||'EXPORT_ERROR');
  return d.exports;
}

function dl(id,label){
  return id?'<a class="export-link nereus-download" href="#" data-export-id="'+esc(id)+'">'+esc(label)+'</a>':'—';
}
function rows(o,prefix){
  return Object.entries(o||{}).map(([k,v]) =>
    '<div>'+esc(v?.name||k)+'</div>'+
    '<div>'+dl(prefix+':'+k+':pdf','PDF')+'</div>'+
    '<div>'+dl(prefix+':'+k+':xlsx','XLSX')+'</div>'
  ).join('');
}
function box(title,sub,body,extra=''){
  return '<div class="export-box"><div class="export-title"><b>'+title+'</b><small>'+sub+'</small></div>'+
    '<div class="export-grid"><div class="h">REPORT</div><div class="h">PDF</div><div class="h">XLSX</div>'+body+'</div>'+extra+'</div>';
}

function ensureDownloadFrame(){
  let fr=document.getElementById('nereusExportFrame');
  if(!fr){
    fr=document.createElement('iframe');
    fr.id='nereusExportFrame';
    fr.name='nereusExportFrame';
    fr.style.display='none';
    document.body.appendChild(fr);
  }
  return fr;
}
function hiddenInput(name,value){
  const i=document.createElement('input');
  i.type='hidden';i.name=name;i.value=String(value??'');
  return i;
}
function startDownload(exportId,button){
  ensureDownloadFrame();
  const form=document.createElement('form');
  form.method='POST';
  form.action=EXPORT_API;
  form.target='nereusExportFrame';
  form.style.display='none';
  form.appendChild(hiddenInput('action','download'));
  form.appendChild(hiddenInput('export_id',exportId));
  form.appendChild(hiddenInput('device_id',device));
  form.appendChild(hiddenInput('access_token',state.token));
  document.body.appendChild(form);
  if(button){
    const old=button.textContent;
    button.textContent='...';
    button.style.pointerEvents='none';
    setTimeout(()=>{button.textContent=old;button.style.pointerEvents='';},1800);
  }
  form.submit();
  setTimeout(()=>form.remove(),3000);
}
function bindDownloads(root){
  root.querySelectorAll('.nereus-download').forEach(a=>{
    a.addEventListener('click',e=>{
      e.preventDefault();
      const id=a.getAttribute('data-export-id')||'';
      if(id)startDownload(id,a);
    });
  });
}

async function renderExport(){
  const root=document.querySelector('#export');
  if(!exportAllowed()){root.innerHTML='';return}
  root.innerHTML='<div class="empty">Загрузка Export Center…</div>';
  try{
    const m=await exportManifest(),v=m.views||{};
    root.innerHTML=
      '<div class="section">EXPORT CENTER</div>'+
      box('SCHEDULES','исходные табличные сводки',rows(m.schedules,'schedule'))+
      box('PORT VIEWS · COMMERCIAL','все колонки',rows(v.commercial,'view:commercial'),
        '<div style="margin-top:9px">'+dl('view:commercial:all:xlsx','ALL 4 PORTS · XLSX')+'</div>')+
      box('PORT VIEWS · NO COMMERCIAL','без коммерческих полей',rows(v.no_commercial,'view:no_commercial'),
        '<div style="margin-top:9px">'+dl('view:no_commercial:all:xlsx','ALL 4 PORTS · XLSX')+'</div>')+
      box('WEATHER REPORT','актуальная погода',
        '<div>'+esc(m.weather?.name||'Weather Report')+'</div>'+
        '<div>'+dl('weather:pdf','PDF')+'</div>'+
        '<div>'+dl('weather:xlsx','XLSX')+'</div>');
    bindDownloads(root);
  }catch(err){
    root.innerHTML='<div class="section">EXPORT CENTER</div><div class="export-note">Экспорт сейчас недоступен: '+esc(err.message||'EXPORT_ERROR')+'</div>';
  }
}

const baseSwitch=switchView;
switchView=function(v){
  if(v==='export'){
    if(!exportAllowed())return baseSwitch('brief');
    state.view='export';
    ['brief','schedules','weather','portInfo','export','admin'].forEach(x=>document.querySelector('#'+x)?.classList.toggle('hidden',x!=='export'));
    document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view==='export'));
    document.querySelector('#reportMeta').textContent='Export Center · v1.1.24';
    renderExport();
    return;
  }
  document.querySelector('#export')?.classList.add('hidden');
  baseSwitch(v);
  syncExportNav();
};
const baseRender=render;
render=function(){baseRender();syncExportNav();if(state.view==='export')renderExport()};
syncExportNav();
})();
</script>
<script src="https://cdn.jsdelivr.net/gh/Peter1993-NEREUS/VOLGA-4007-Drift-Model@ba00e07e12967bd2e888ed81ea70e209980f0fb2/nereus-operations-v02/app/src/main/assets/port-info-v043.js"></script><script>
(function(){
  state.departedPending=Array.isArray(state.departedPending)?state.departedPending:[];

  function pendingKey(v){
    return [
      String(v?.imo||v?.vessel||'').trim().toUpperCase(),
      String(v?.port||'').trim().toUpperCase(),
      String(v?.terminal||'').trim().toUpperCase(),
      String(v?.eta||'').trim(),
      String(v?.load_position||'').trim().toUpperCase()
    ].join('|');
  }

  function pendingForPort(port){
    const p=String(port||'').trim().toUpperCase();
    const seen=new Set();
    return (state.departedPending||[]).filter(v=>{
      if(String(v?.port||'').trim().toUpperCase()!==p)return false;
      const k=pendingKey(v);
      if(seen.has(k))return false;
      seen.add(k);
      return true;
    });
  }

  async function loadDepartedPendingWeb(){
    if(!state.token)return;
    try{
      const d=await call('departedPending');
      state.departedPending=Array.isArray(d?.rows)?d.rows:[];
      if(state.reports&&state.view==='brief')renderBrief();
    }catch(err){
      console.warn('DEPARTED_PENDING unavailable',err);
      state.departedPending=[];
      if(state.reports&&state.view==='brief')renderBrief();
    }
  }
  window.nereusLoadDepartedPending=loadDepartedPendingWeb;

  renderBrief=function(){
    const d=state.reports?.mobile||{ports:[]};
    const ps=d.ports||[];
    if(!state.port||!ps.some(p=>p.name===state.port))state.port=ps[0]?.name;

    const p=ps.find(q=>q.name===state.port);
    let h=chips(ps.map(q=>q.name),state.port);

    if(p){
      const groups=(p.groups||[]).slice();
      const pending=pendingForPort(p.name);

      if(pending.length){
        const g={
          status:'DEPARTED · ETS NOT YET',
          vessels:pending.map(v=>({
            vessel:v.vessel||'',
            terminal:v.terminal||'',
            cargo:v.cargo||'',
            qty:v.qty||'',
            loadPosition:v.load_position||'',
            eta:v.eta||'',
            etb:v.etb||'',
            ets:'NOT YET'
          }))
        };
        const idx=groups.findIndex(x=>x.status==='DEPARTED - LAST 5 DAYS');
        if(idx>=0)groups.splice(idx,0,g);else groups.push(g);
      }

      for(const g of groups){
        h+='<div class="section">'+esc(g.status)+' · '+g.vessels.length+'</div>';
        h+=g.vessels.length
          ? '<div class="grid">'+g.vessels.map(v=>
              '<div class="vessel">'+
                '<b>'+esc(v.vessel)+'</b>'+
                '<div class="terminal">'+esc(v.terminal||'—')+'</div>'+
                '<div class="cargo"><span>'+esc(v.cargo||'—')+'</span><span>'+esc(v.qty||'—')+' MT</span></div>'+
                '<div class="loadpos"><span>LOAD POSITION</span><b>'+esc(v.loadPosition||'—')+'</b></div>'+
                '<div class="times">'+
                  '<div class="time"><span>ETA / ARR</span><b>'+esc(v.eta||'—')+'</b></div>'+
                  '<div class="time"><span>ETB</span><b>'+esc(v.etb||'—')+'</b></div>'+
                  '<div class="time"><span>ETS</span><b>'+esc(v.ets||'—')+'</b></div>'+
                '</div>'+
              '</div>'
            ).join('')+'</div>'
          : '<div class="empty">Нет судов</div>';
      }
    }

    $('#brief').innerHTML=h;
    $('#brief').querySelectorAll('[data-chip]').forEach(b=>{
      b.onclick=()=>{state.port=b.dataset.chip;renderBrief()}
    });
  };

  const baseAppViewPending=appView;
  appView=function(){
    baseAppViewPending();
    setTimeout(loadDepartedPendingWeb,0);
  };

  const refreshBtn=document.querySelector('#refresh');
  if(refreshBtn)refreshBtn.addEventListener('click',()=>setTimeout(loadDepartedPendingWeb,50));

  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible'&&(state.token||state.refresh)){
      setTimeout(loadDepartedPendingWeb,50);
    }
  });

  if(state.token)setTimeout(loadDepartedPendingWeb,100);
})();
</script>
