plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nereus.operations'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nereus.operations'
        minSdk 24
        targetSdk 35
        versionCode 12
        versionName '0.3.9'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
}
